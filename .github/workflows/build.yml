# Runs the full build, as AGENTS.md asks before each commit: the code checks,
# the Android libraries, the C tests (ASan, UBSan) and the JVM host tests. The
# device test needs a phone and does not run here.
name: Build

on:
  push:
    branches: [next]
  pull_request:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The lowest JDK that the README names.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The versions come from the catalog, so a new pin needs no change here.
      - name: Install the NDK and CMake
        run: |
          version() { sed -n "s/^$1 = \"\(.*\)\"$/\1/p" gradle/libs.versions.toml; }
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$(version ndk)" "cmake;$(version cmake)"
          # The version that `clang-format` in the catalog must name.
          "$ANDROID_HOME/ndk/$(version ndk)/toolchains/llvm/prebuilt/linux-x86_64/bin/clang-format" --version

      # npm installs the web core that the native build embeds
      # (native/package.json); Node as tools/node-peer needs it.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: native/package-lock.json

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Writes the cache on `next` too, which is not the default branch.
          cache-read-only: ${{ github.ref != 'refs/heads/next' }}

      - run: ./gradlew build --console=plain
