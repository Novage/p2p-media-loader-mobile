[versions]
android-minSdk = "24"
android-compileSdk = "37"
android-targetSdk = "36"
# What an app that uses the library must compile against (aar-metadata).
android-minCompileSdk = "37"
agp = "9.5.2"
kotlin = "2.4.21"
media3 = "1.11.1"
spotless = "8.9.0"
ktfmt = "0.64"
# The first detekt built on the Kotlin 2.4 compiler, which type resolution needs.
detekt = "2.0.0-alpha.6"
# The NDK and CMake that build native/ (Android Studio's SDK Manager installs
# them). This NDK is r30.
ndk = "30.0.16248370"
# The clang-format of that NDK. Spotless stops when the two do not agree.
clang-format = "21.0.0"
cmake = "3.31.0"
androidx-test-runner = "1.7.0"
# fetch's HTTP client (specs/engine.md, "The platform's network clients"): Ktor in
# common code, with its OkHttp engine on Android.
ktor = "3.6.1"
kotlinx-coroutines = "1.11.0"
# The OkHttp of ktor-client-okhttp: its test server for the HTTP tests.
okhttp = "5.5.1"
# Android has org.json; the JVM tests need its own implementation (android.jar's
# is only stubs).
org-json = "20260814"

[libraries]
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
okhttp-mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
org-json = { module = "org.json:json", version.ref = "org-json" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
